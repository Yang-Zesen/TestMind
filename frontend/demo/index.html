<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TestMind 任务工作台</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#20232a;background:#f5f7f8;letter-spacing:0}header{padding:20px 28px;background:#fff;border-bottom:1px solid #dce2e5;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:24px}header span{font-size:12px;color:#596570}main{max-width:1180px;margin:auto;padding:24px}label{display:block;margin-bottom:8px}select,input,textarea,button{font:inherit;border:1px solid #c6ced4;border-radius:4px;padding:10px;background:white}textarea{resize:vertical;width:100%;min-height:100px}button{cursor:pointer;color:#0c6760}button.primary{background:#0d766b;color:white;border-color:#0d766b}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:180px}.row input,.row select{width:100%}section{padding:20px 0;border-bottom:1px solid #dce2e5}h2{font-size:17px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #e0e5e7;text-align:left;overflow-wrap:anywhere}th{font-size:12px;color:#57646b}.scroll{overflow-x:auto}#error{color:#b42318;min-height:20px;margin:12px 0}#answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}#details{display:none}pre{white-space:pre-wrap;word-break:break-word;color:#52636d;background:#eaf0f2;padding:14px;max-height:230px;overflow:auto}.status{color:#0d766b;font-weight:600}#events{font:12px ui-monospace,monospace;line-height:1.6}button:focus,input:focus,textarea:focus,select:focus{outline:2px solid #08a08d;outline-offset:2px}@media(max-width:600px){header{padding:16px}main{padding:16px}th,td{padding:10px 4px}h1{font-size:22px}}
</style>
<style>table{min-width:600px}button{white-space:nowrap}#details{scroll-margin-top:16px}</style>
<header><h1>TestMind</h1><span>任务工作台 · 本地演示 / 离线模型</span><span id="health" style="margin-left:auto"></span></header>
<main>
<section><div class="row"><div><label for="user">演示身份</label><select id="user"><option value="demo-user">demo-user · demo-project</option><option value="demo-other">demo-other · other-project</option></select></div><div><label for="session">会话</label><input id="session" value="demo-session"></div></div></section>
<section><h2>问答任务</h2><form id="submit"><label for="query">问题</label><textarea id="query" maxlength="6000" required placeholder="例如：What is pytest?"></textarea><div class="row" style="margin-top:12px"><button class="primary" type="submit">提交任务</button><button id="refresh" type="button">刷新任务</button></div></form><div id="error" role="alert"></div></section>
<section><h2>任务列表</h2><div class="scroll"><table><thead><tr><th>任务</th><th>状态</th><th>会话</th><th>创建时间</th><th></th></tr></thead><tbody id="tasks"></tbody></table></div></section>
<section id="details"><div class="row"><h2 id="title" style="flex:1;overflow-wrap:anywhere"></h2><button id="reconnect" type="button" title="重连事件" aria-label="重连事件">&#8635;</button><button id="cancel" type="button">取消任务</button></div><p id="status" class="status"></p><div id="answer"></div><form id="resume" hidden><label for="followup">补充输入</label><textarea id="followup" required maxlength="6000"></textarea><button class="primary" type="submit">恢复任务</button></form><pre id="events"></pre></section>
</main>
<script>
const el=id=>document.getElementById(id);let current=null,version=0,subscription=null,lastSeq=0;
const headers=()=>({'Content-Type':'application/json','X-Demo-User':el('user').value});
async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...options.headers}});if(!response.ok){const error=await response.json();throw Error(`${response.status}: ${JSON.stringify(error.detail)}`)}return response.json()}
function fail(error){if(error.name!=='AbortError')el('error').textContent=error.message}
async function refresh(){const user=el('user').value;try{const tasks=await api('/api/v1/tasks');if(user!==el('user').value)return;el('tasks').replaceChildren();for(const task of tasks.slice(0,10)){const row=document.createElement('tr');for(const value of [task.task_id.slice(0,8),task.status,task.session_id,new Date(task.created_at).toLocaleString()]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}const cell=document.createElement('td'),button=document.createElement('button');button.textContent='查看';button.onclick=()=>openTask(task.task_id);cell.append(button);row.append(cell);el('tasks').append(row)}}catch(e){if(user===el('user').value)fail(e)}}
async function detail(){const id=current,user=el('user').value;if(!id)return;const task=await api(`/api/v1/tasks/${id}`);if(id!==current||user!==el('user').value)return;version=task.version;el('status').textContent=`${task.status} · 版本 ${version} · 执行 ${task.attempt_count} 次`;el('answer').textContent=task.result.answer||task.result.clarification_question||task.error_code||'';el('resume').hidden=task.status!=='waiting_input';el('cancel').disabled=['completed','failed','denied','cancelled','rejected'].includes(task.status);return task}
async function watch(id){const controller=new AbortController();subscription=controller;try{const response=await fetch(`/api/v1/tasks/${id}/events`,{headers:{...headers(),'Last-Event-ID':String(lastSeq)},signal:controller.signal});if(!response.ok)throw Error(`事件订阅失败 ${response.status}`);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(!controller.signal.aborted){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let split;while((split=buffer.indexOf('\n\n'))>=0){if(controller.signal.aborted||current!==id)return;const event=buffer.slice(0,split);buffer=buffer.slice(split+2);if(event.startsWith(':'))continue;const seq=event.match(/^id: (\d+)/m);if(seq)lastSeq=Number(seq[1]);el('events').textContent+=event+'\n\n';await detail();await refresh()}}}catch(e){if(!controller.signal.aborted&&current===id)fail(e)}finally{if(subscription===controller)subscription=null}}
async function openTask(id){if(subscription)subscription.abort();current=id;lastSeq=0;el('details').style.display='block';el('title').textContent='任务 '+id.slice(0,8);el('events').textContent='';try{await detail();el('details').scrollIntoView({block:'start'});watch(id)}catch(e){fail(e)}}
el('submit').onsubmit=async event=>{event.preventDefault();el('error').textContent='';const button=event.submitter;button.disabled=true;try{const task=await api('/api/v1/tasks',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({query:el('query').value,project_id:el('user').value==='demo-user'?'demo-project':'other-project',session_id:el('session').value})});await refresh();await openTask(task.task_id)}catch(e){fail(e)}finally{button.disabled=false}};
el('resume').onsubmit=async event=>{event.preventDefault();try{await api(`/api/v1/tasks/${current}/resume`,{method:'POST',body:JSON.stringify({query:el('followup').value,expected_version:version})});if(subscription)subscription.abort();watch(current);await detail();await refresh()}catch(e){fail(e)}};
el('cancel').onclick=async()=>{try{await api(`/api/v1/tasks/${current}/cancel`,{method:'POST'});await detail();await refresh()}catch(e){fail(e)}};
el('reconnect').onclick=()=>{if(subscription)subscription.abort();el('error').textContent='';if(current)watch(current)};
el('refresh').onclick=refresh;el('user').onchange=()=>{if(subscription)subscription.abort();current=null;el('details').style.display='none';el('error').textContent='';refresh()};api('/ready').then(value=>el('health').textContent=value.status).catch(fail);refresh();
</script>
</html>
